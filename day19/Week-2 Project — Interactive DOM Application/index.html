<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Addis Market</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Addis Market Shopping List</h1>
    
    <form id="add-form">
      <input type="text" id="name" placeholder="Item name" required>
      <input type="number" id="price" placeholder="Price (ETB)" min="0" step="0.01" required>
      <button type="submit">Add Item</button>
    </form>

    <ul id="list">
      <!-- Items will be appended here -->
    </ul>

    <div class="total-container">
      <strong>Total: <span id="total">0</span> ETB</strong>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
