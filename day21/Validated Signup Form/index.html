<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Persistent Signup</title>
  <style>
    body { font-family: sans-serif; padding: 2rem; max-width: 400px; margin: 0 auto; background: #f9f9f9; }
    .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    form { display: flex; flex-direction: column; gap: 1rem; }
    input { padding: 0.5rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 0.75rem; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    #message-area { min-height: 1.5rem; margin-bottom: 1rem; font-weight: bold; }
    .error { color: #d93025; }
    .success { color: #188038; }
    .stats { margin-top: 2rem; padding-top: 1rem; border-top: 2px solid #eee; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sign Up</h1>
    <div id="message-area"></div>
    <form id="signup-form">
      <div>
        <label>Full Name</label><br>
        <input type="text" id="name" placeholder="E.g. Abebe Bikila">
      </div>
      <div>
        <label>Phone Number</label><br>
        <input type="text" id="phone" placeholder="09... or +2519...">
      </div>
      <button type="submit">Submit</button>
    </form>
    <div class="stats">
      Total Signups: <strong id="signup-count">0</strong>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
