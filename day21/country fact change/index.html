<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Country Facts Explorer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Country Facts</h1>
    <form id="search-form">
      <input type="text" id="country-input" placeholder="Enter country name (e.g., Ethiopia)" required>
      <button type="submit">Search</button>
    </form>
    <div id="facts" class="output-area"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
