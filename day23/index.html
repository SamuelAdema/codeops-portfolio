<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Addis Watches</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Addis Watches ⌚</h1>
    <p>Premium timepieces for every wrist.</p>
  </header>

  <div class="app-layout">
    <!-- Main Content: Controls & Grid -->
    <main>
      <section class="controls">
        <input type="text" id="search-input" placeholder="Search watches...">
        <select id="brand-filter">
          <option value="All">All Brands</option>
          <option value="Seiko">Seiko</option>
          <option value="Casio">Casio</option>
          <option value="Rolex">Rolex</option>
          <option value="Omega">Omega</option>
        </select>
      </section>
      
      <section id="product-grid" class="grid">
        <!-- Products rendered here via JS -->
      </section>
    </main>

    <!-- Sidebar: Cart -->
    <aside class="cart-section">
      <h2>Shopping Cart 🛒</h2>
      <ul id="cart-list">
        <!-- Cart items rendered here via JS -->
      </ul>
      <div class="cart-total">
        <strong>Total: $<span id="cart-total-amount">0</span></strong>
      </div>
    </aside>
  </div>

  <script src="app.js"></script>
</body>
</html>
